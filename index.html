<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Království Železa a Kamene: Budovatelská Strategie</title>
    <!-- Medieval & Strategy Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=MedievalSharp&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Phaser 3.80.1 Engine -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-root">
        <!-- Phaser Canvas Mount Point -->
        <div id="canvas-container"></div>

        <!-- Strategy HUD Header: Kingdom Economy & Demographics -->
        <header id="kingdom-hud">
            <div class="hud-brand">
                <div class="realm-crest">👑</div>
                <div class="realm-info">
                    <h1 id="realm-name">Království Aldoria</h1>
                    <span id="realm-tier">Úroveň Panství: <strong>Vévodství (Úr. 1)</strong></span>
                </div>
            </div>

            <!-- Complex Multi-Tier Resource Economy -->
            <div class="economy-bar">
                <div class="res-stat" title="Volní dělníci a celková kapacita poddaných">
                    <span class="icon">👥</span>
                    <div class="res-vals">
                        <span class="lbl">PODDANÍ</span>
                        <span class="num" id="stat-pop">12 / 20</span>
                    </div>
                </div>

                <div class="res-stat" title="Dřevo - základní stavební materiál z pil a lesů">
                    <span class="icon">🪵</span>
                    <div class="res-vals">
                        <span class="lbl">DŘEVO</span>
                        <span class="num" id="stat-wood">450</span>
                        <span class="rate" id="rate-wood">+18/m</span>
                    </div>
                </div>

                <div class="res-stat" title="Kámen - na hradby, věže a pokročilé budovy">
                    <span class="icon">🪨</span>
                    <div class="res-vals">
                        <span class="lbl">KÁMEN</span>
                        <span class="num" id="stat-stone">300</span>
                        <span class="rate" id="rate-stone">+12/m</span>
                    </div>
                </div>

                <div class="res-stat" title="Železo - kování zbraní a brnění pro armádu">
                    <span class="icon">⛓️</span>
                    <div class="res-vals">
                        <span class="lbl">ŽELEZO</span>
                        <span class="num" id="stat-iron">150</span>
                        <span class="rate" id="rate-iron">+6/m</span>
                    </div>
                </div>

                <div class="res-stat" title="Obilí &amp; Chléb - obživa pro poddané (při nedostatku lidé hladoví!)">
                    <span class="icon">🌾</span>
                    <div class="res-vals">
                        <span class="lbl">JÍDLO</span>
                        <span class="num" id="stat-food">280</span>
                        <span class="rate" id="rate-food">+24/m</span>
                    </div>
                </div>

                <div class="res-stat gold-stat" title="Zlaté koruny - daně z domů a obchodní zisky">
                    <span class="icon">🪙</span>
                    <div class="res-vals">
                        <span class="lbl">POKLADNA</span>
                        <span class="num" id="stat-gold">650</span>
                        <span class="rate" id="rate-gold">+35/m</span>
                    </div>
                </div>
            </div>

            <div class="hud-controls">
                <button class="icon-btn" id="btn-speed" title="Rychlost simulace (1x / 2x / 5x)">⏩ 1x</button>
                <button class="icon-btn" id="btn-audio" title="Zvuky">🔊</button>
            </div>
        </header>

        <!-- Bottom Construction & Management Dock -->
        <footer id="strategy-dock">
            <div class="dock-category-tabs">
                <button class="cat-btn active" data-cat="economy">🌾 Ekonomika &amp; Suroviny</button>
                <button class="cat-btn" data-cat="housing">🏡 Město &amp; Obyvatelé</button>
                <button class="cat-btn" data-cat="military">⚔️ Vojenské &amp; Hradby</button>
                <button class="cat-btn" data-cat="roads">🛤️ Cesty &amp; Bourání</button>
            </div>

            <div class="build-cards-shelf" id="build-shelf">
                <!-- Dynamically populated build cards based on category -->
            </div>
        </footer>

        <!-- Active Selected Building / Tile Inspector Modal Panel -->
        <aside id="inspector-panel" class="inspector-drawer hidden">
            <div class="inspector-header">
                <h3 id="insp-title">Královská Radnice</h3>
                <button class="btn-close" id="btn-close-insp">&times;</button>
            </div>
            <div class="inspector-content" id="insp-content">
                <!-- Injected via JavaScript -->
            </div>
        </aside>

        <!-- Toast Notifications -->
        <div id="toast-deck"></div>
    </div>

    <!-- Main Game Script -->
    <script src="game.js"></script>
</body>
</html>
