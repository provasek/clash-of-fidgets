<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aetheria: Bastion of the Void</title>
    <!-- Google Fonts for High-Fantasy Sci-Fi Hybrid Style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Phaser 3.80.1 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-wrapper">
        <!-- Floating HUD Overlays generated cleanly above the WebGL Canvas -->
        <header id="game-hud">
            <div class="hud-left">
                <div class="bastion-crest" id="hud-crest">⚡</div>
                <div class="bastion-identity">
                    <div class="bastion-title" id="hud-commander-name">Aetherarch Valerius</div>
                    <div class="bastion-rank">Stupeň Jádra: <span id="hud-core-rank">1</span> • Síla Bastionu: <span id="hud-power-score">140</span></div>
                </div>
            </div>

            <!-- Currency & Cosmic Energies Bar -->
            <div class="hud-resources">
                <div class="res-badge shards" title="Astrální Střepy (Základní hmota na stavbu a krystalizaci)">
                    <span class="icon">💎</span>
                    <div class="vals">
                        <span class="val" id="res-shards">1,200</span>
                        <span class="rate" id="rate-shards">+60/m</span>
                    </div>
                </div>
                <div class="res-badge aether" title="Tekutý Aether (Energie pro technologie, portály a rezonanci)">
                    <span class="icon">🌀</span>
                    <div class="vals">
                        <span class="val" id="res-aether">850</span>
                        <span class="rate" id="rate-aether">+45/m</span>
                    </div>
                </div>
                <div class="res-badge chronos" title="Chronos Kameny (Ohýbají časoprostor - instantní akce a přetížení)">
                    <span class="icon">⏳</span>
                    <div class="vals">
                        <span class="val" id="res-chronos">15</span>
                    </div>
                </div>
                <div class="res-badge renown" title="Věhlas v Říši (Žebříčkový vliv)">
                    <span class="icon">👑</span>
                    <div class="vals">
                        <span class="val" id="res-renown">250</span>
                    </div>
                </div>
            </div>

            <div class="hud-actions">
                <button class="hud-icon-btn" id="btn-toggle-audio" title="Audio">🔊</button>
                <button class="hud-icon-btn" id="btn-fullscreen" title="Celá obrazovka">⛶</button>
            </div>
        </header>

        <!-- The WebGL Canvas Container -->
        <div id="phaser-mount"></div>

        <!-- Dynamic Game Bottom Control Dock (Contextual) -->
        <nav id="bottom-dock">
            <button class="dock-btn active" data-scene="CitadelScene">
                <span class="icon">🏛️</span>
                <span class="label">Citadela</span>
            </button>
            <button class="dock-btn" data-scene="CommanderScene">
                <span class="icon">🧬</span>
                <span class="label">Komandér &amp; Moduly</span>
            </button>
            <button class="dock-btn pulse-glow" data-scene="NexusScene">
                <span class="icon">🌌</span>
                <span class="label">Trhliny Prázdnoty</span>
            </button>
            <button class="dock-btn" data-scene="SanctumScene">
                <span class="icon">🧪</span>
                <span class="label">Syntetizátor</span>
            </button>
            <button class="dock-btn highlight-danger" data-scene="BreachScene">
                <span class="icon">⚔️</span>
                <span class="label">Průlom (Invaze)</span>
            </button>
        </nav>

        <!-- Floating Context Modal / Inspector (Build, Inspect, Dialogue) -->
        <div id="inspector-overlay" class="overlay-panel hidden">
            <div class="overlay-header">
                <h3 id="inspector-title">Stavební Matice</h3>
                <button class="close-btn" id="btn-close-inspector">&times;</button>
            </div>
            <div class="overlay-body" id="inspector-content">
                <!-- Injected via JavaScript -->
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-rack"></div>
    </div>

    <!-- Main Game Script Modularly Built -->
    <script src="game.js"></script>
</body>
</html>
