<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Polytropia: Civilizace Hvězd (Tahová 4X Strategie)</title>
    <!-- Modern Clean Minimalist Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Phaser 3.80.1 Engine -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-app">
        <!-- Canvas Container -->
        <div id="phaser-viewport"></div>

        <!-- Clean Modern 4X Strategy HUD -->
        <header id="civ-hud">
            <div class="tribe-badge">
                <div class="tribe-crest" id="tribe-crest">🔷</div>
                <div class="tribe-meta">
                    <div class="tribe-name" id="tribe-name">Impérium Solaria</div>
                    <div class="turn-counter">TAH <span id="hud-turn-num">1</span> / 30 • Skóre: <strong id="hud-score">120</strong></div>
                </div>
            </div>

            <div class="economy-cluster">
                <div class="star-pill" title="Hvězdy - univerzální produkce tvých měst pro výzkum a výcvik">
                    <span class="icon">⭐</span>
                    <span class="stars-val" id="hud-stars">10</span>
                    <span class="stars-income" id="hud-income">+4/kolo</span>
                </div>
                <div class="cities-pill" title="Počet kontrolovaných měst">
                    <span class="icon">🏛️</span>
                    <span id="hud-cities-count">1</span>
                </div>
            </div>

            <div class="hud-buttons">
                <button class="hud-btn tech-btn" id="btn-open-tech" title="Otevřít Strom Technologií">
                    🔬 Strom Technologií
                </button>
                <button class="hud-btn end-turn-btn" id="btn-end-turn" title="Ukončit tah a nechat hrát soupeře">
                    <span>UKONČIT TAH</span> ⏳
                </button>
            </div>
        </header>

        <!-- Selected Entity Action Dock (Dynamic Unit or City Controls) -->
        <div id="entity-dock" class="dock-panel hidden">
            <div class="dock-header">
                <div class="dock-title-group">
                    <span class="dock-icon" id="dock-icon">🗡️</span>
                    <div>
                        <h3 id="dock-title">Válečník</h3>
                        <span class="dock-sub" id="dock-subtitle">Pěší průzkumná jednotka (HP: 10/10)</span>
                    </div>
                </div>
                <button class="dock-close-btn" id="btn-close-dock">&times;</button>
            </div>
            <div class="dock-actions" id="dock-actions-shelf">
                <!-- Buttons injected via JavaScript -->
            </div>
        </div>

        <!-- Tech Tree Modal (Polytopia Style Clean Nodes) -->
        <div id="tech-modal" class="modal-backdrop hidden">
            <div class="modal-card">
                <div class="modal-head">
                    <h2>🔬 STROM TECHNOLOGIÍ</h2>
                    <button class="close-x" id="btn-close-tech">&times;</button>
                </div>
                <div class="tech-grid" id="tech-grid">
                    <!-- Injected via JavaScript -->
                </div>
            </div>
        </div>

        <!-- Victory / Defeat Modal Screen -->
        <div id="game-over-modal" class="modal-backdrop hidden">
            <div class="modal-card victory-card">
                <div class="vic-icon" id="vic-icon">🏆</div>
                <h1 id="vic-title">SLAVNÉ VÍTĚZSTVÍ!</h1>
                <p id="vic-desc">Tvá civilizace ovládla známý svět a rozdrtila všechny rivaly.</p>
                <div class="final-score">Konečné skóre: <strong id="vic-score">2,450</strong></div>
                <button class="hud-btn end-turn-btn" id="btn-restart-game">Hrát Novou Partii</button>
            </div>
        </div>

        <!-- Clean Animated Toasts -->
        <div id="toast-container"></div>
    </div>

    <!-- Main Game Script -->
    <script src="game.js"></script>
</body>
</html>
