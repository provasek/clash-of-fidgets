<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0a2a3f"/>
      <stop offset="100%" stop-color="#020812"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="100%" stop-color="#c95b00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgGlow)"/>
  <!-- HUD Grid & Frame -->
  <rect x="14" y="14" width="612" height="332" rx="10" fill="none" stroke="#00f3ff" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M14 45 L14 14 L45 14 M595 14 L626 14 L626 45 M14 315 L14 346 L45 346 M595 346 L626 346 L626 315" fill="none" stroke="#00f3ff" stroke-width="3" filter="url(#glow)"/>

  <!-- HUD Telemetry Rings (Left) -->
  <circle cx="135" cy="155" r="78" fill="none" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="12 6"/>
  <circle cx="135" cy="155" r="58" fill="none" stroke="#ffbe0b" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="60 18"/>
  <text x="135" y="148" text-anchor="middle" fill="#00f3ff" font-family="Consolas, monospace" font-size="13" font-weight="bold">BLOOD ALCH</text>
  <text x="135" y="170" text-anchor="middle" fill="#ffbe0b" font-family="Consolas, monospace" font-size="22" font-weight="bold">CRITICAL</text>

  <!-- Stylized Whiskey Tumbler (Center) -->
  <g transform="translate(265, 65)">
    <polygon points="10,20 100,20 90,155 20,155" fill="rgba(0,243,255,0.08)" stroke="#00f3ff" stroke-width="2.5"/>
    <polygon points="17,85 93,85 88,150 22,150" fill="url(#amber)" opacity="0.9"/>
    <!-- Ice cubes -->
    <rect x="30" y="92" width="24" height="22" rx="3" transform="rotate(-10 42 103)" fill="rgba(255,255,255,0.35)" stroke="#fff" stroke-opacity="0.6"/>
    <rect x="55" y="96" width="22" height="22" rx="3" transform="rotate(14 66 107)" fill="rgba(255,255,255,0.3)" stroke="#fff" stroke-opacity="0.5"/>
    <ellipse cx="55" cy="20" rx="45" ry="7" fill="none" stroke="#00f3ff" stroke-width="2"/>
  </g>

  <!-- HUD Diagnostics (Right) -->
  <g font-family="Consolas, monospace" font-size="13" fill="#00f3ff">
    <text x="415" y="100">PROTOCOL: FRIDAY_NIGHT</text>
    <text x="415" y="124" fill="#ffbe0b">STATUS:   REFILL REQUIRED</text>
    <text x="415" y="148">LIVER:    FILING PROTEST</text>
    <text x="415" y="172">ICE:      2 CUBES</text>
    <rect x="415" y="188" width="175" height="10" rx="3" fill="rgba(0,243,255,0.15)" stroke="#00f3ff" stroke-width="1"/>
    <rect x="417" y="190" width="155" height="6" rx="2" fill="#ffbe0b"/>
  </g>

  <!-- Meme Caption Banner -->
  <rect x="30" y="262" width="580" height="64" rx="6" fill="rgba(0, 12, 24, 0.85)" stroke="#ffbe0b" stroke-width="1.5"/>
  <text x="320" y="304" text-anchor="middle" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="34" letter-spacing="2" filter="url(#glow)">
    "JARVIS, MORE ALCOHOL."
  </text>
</svg>
